name: Daily Backlink Building — alfaapanels.com

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day (09:00 Istanbul / 10:00 Gulf)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write           # Needed to commit reports back to the repo

jobs:
  build-backlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Off-Page SEO Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python offpage_seo_agent.py

      - name: Commit daily report
        run: |
          git config --local user.email "seo-agent@alfaapanels.com"
          git config --local user.name "SEO Agent Bot"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new report to commit."
          else
            git commit -m "SEO report $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi
