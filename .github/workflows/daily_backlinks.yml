name: Daily Backlink Builder – alfaapanels.com

on:
  schedule:
    # Runs every day at 08:00 UTC (adjust to your preferred time)
    - cron: "0 8 * * *"
  workflow_dispatch:  # allow manual runs from GitHub UI

jobs:
  build-backlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit back the updated log
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily backlink builder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_backlink_builder.py

      - name: Commit results back to repo
        run: |
          git config user.name  "Backlink Bot"
          git config user.email "backlinks@alfaapanels.com"
          git add backlink_log.json daily_reports/ || true
          git diff --cached --quiet || git commit -m "chore: daily backlinks $(date +%Y-%m-%d)"
          git push
