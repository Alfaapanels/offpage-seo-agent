name: Daily Backlink Builder - alfaapanels.com

on:
  schedule:
    # Runs every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if already ran today"
        required: false
        default: "false"

jobs:
  build-backlinks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily backlink builder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python daily_runner.py --force
          else
            python daily_runner.py
          fi

      - name: Commit and push reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ backlink_tracker.json
          if git diff --cached --quiet; then
            echo "No new reports to commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: daily backlink report ${DATE} for alfaapanels.com"
            git push origin HEAD
          fi
